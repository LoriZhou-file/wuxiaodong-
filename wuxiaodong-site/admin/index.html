<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>网站后台 · 吴晓东</title>
<style>
:root{--bg:#f4f2ec;--ink:#1d2420;--muted:#667068;--green:#3b5a45;--line:#d9d6cc;--card:#fff;--red:#a33a2c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;font-weight:600;margin-right:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:6px}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.primary:disabled{opacity:.45;cursor:default}
button.danger{color:var(--red)}
button.small{padding:2px 9px;font-size:13px}
#status{font-size:13px;color:var(--muted)}
#status.err{color:var(--red)}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:12px 20px 0}
nav button{border-radius:6px 6px 0 0;border-bottom:0}
nav button.on{background:var(--green);color:#fff;border-color:var(--green)}
main{max-width:920px;margin:0 auto;padding:18px 20px 120px}
.login{max-width:360px;margin:12vh auto;padding:28px;background:#fff;border:1px solid var(--line);border-radius:10px}
.login h1{margin:0 0 14px;font-size:20px}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=date],textarea,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:inherit}
textarea{min-height:92px;resize:vertical}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bi span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
@media(max-width:640px){.bi{grid-template-columns:1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0}
.item>summary{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;list-style:none}
.item>summary::-webkit-details-marker{display:none}
.item>summary .t{flex:1;font-weight:600}
.item>summary .s{color:var(--muted);font-size:13px}
.item .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.row2{grid-template-columns:1fr}}
.img{display:flex;gap:12px;align-items:center}
.img img{width:92px;height:68px;object-fit:cover;background:#ddd;border-radius:4px}
.img .tools{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 16px 16px}
.panel h2{font-size:16px;margin:16px 0 0}
.check{display:flex;gap:8px;align-items:center;margin-top:12px}
.check input{width:auto}
</style>
</head>
<body>
<div id="app"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
