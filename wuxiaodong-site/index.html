<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wu Xiaodong 吴晓东 | Official Artist Website</title>
<meta name="description" content="Wu Xiaodong (b. 1968, Shanghai) — founder of Carbon-Based Naturalism. Mineral pigment on Xuan paper, letting gravity and water write every line.">
<meta property="og:type" content="website">
<meta property="og:title" content="Wu Xiaodong 吴晓东">
<meta property="og:description" content="Carbon-Based Naturalism · The Third Route">
<meta property="og:image" content="images/hero.jpg">
<meta name="theme-color" content="#f5f3ee">
<link rel="preload" as="image" href="images/hero.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top" id="top">
  <a class="brand" href="#top" aria-label="Wu Xiaodong"><span data-i18n-site="name"></span></a>
  <nav class="nav" aria-label="Main">
    <a href="#works" data-ui="works"></a>
    <a href="#concept" data-ui="concept"></a>
    <a href="#exhibitions" data-ui="exhibitions"></a>
    <a href="#video" data-ui="video"></a>
    <a href="#about" data-ui="about"></a>
    <a href="#news" data-ui="news" id="nav-news" hidden></a>
    <a href="#contact" data-ui="contact"></a>
  </nav>
  <div class="tools">
    <a class="ig" id="ig-top" href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>
    </a>
    <button class="lang" id="lang" type="button" aria-label="Language">中文</button>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <img id="hero-img" src="images/hero.jpg" alt="">
    <div class="hero-text">
      <p class="hero-tag" id="hero-tag"></p>
      <h1 id="hero-title"></h1>
      <p class="hero-cap" id="hero-cap"></p>
    </div>
  </section>

  <section class="sec" id="works">
    <div>
      <span class="sec-label" data-ui="works"></span>
      <div class="series-filter" id="series-filter"></div>
      <div class="grid" id="works-grid"></div>
    </div>
  </section>

  <section class="sec alt" id="concept">
    <div>
      <span class="sec-label" data-ui="concept"></span>
      <p class="concept-intro" id="concept-intro"></p>
      <div id="concept-body"></div>
      <blockquote class="concept-closing" id="concept-closing"></blockquote>
    </div>
  </section>

  <section class="sec" id="exhibitions">
    <div>
      <span class="sec-label" data-ui="exhibitions"></span>
      <div id="ex-upcoming-wrap" hidden>
        <h3 data-ui="upcoming"></h3>
        <ul class="ex" id="ex-upcoming"></ul>
      </div>
      <h3 data-ui="past"></h3>
      <ul class="ex" id="ex-past"></ul>
    </div>
  </section>

  <section class="sec alt" id="video">
    <div>
      <span class="sec-label" data-ui="video"></span>
      <figure class="vid">
        <video id="vid" controls preload="none" playsinline></video>
        <figcaption id="vid-cap"></figcaption>
      </figure>
    </div>
  </section>

  <section class="sec" id="about">
    <div>
      <span class="sec-label" data-ui="about"></span>
      <div class="about">
        <div class="about-portrait-wrap">
          <img id="about-img" alt="Wu Xiaodong">
          <div class="about-portrait-label" id="about-portrait-label">Wu Xiaodong 吴晓东</div>
        </div>
        <div>
          <p class="lead" id="about-bio"></p>
          <div class="theory" id="about-theory"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec alt" id="news" hidden>
    <div>
      <span class="sec-label" data-ui="news"></span>
      <ul class="news" id="news-list"></ul>
    </div>
  </section>

  <section class="sec" id="contact">
    <div>
      <h2 data-ui="contact"></h2>
      <p class="contact-sub" id="contact-sub"></p>
      <div class="contact-links" id="contact-lines"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <span id="foot-copy"></span>
  <span><a id="ig-foot" href="#" target="_blank" rel="noopener">Instagram</a></span>
</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true">
  <button class="lb-x" id="lb-x" type="button" aria-label="Close">×</button>
  <button class="lb-nav prev" id="lb-prev" type="button" aria-label="Previous">‹</button>
  <button class="lb-nav next" id="lb-next" type="button" aria-label="Next">›</button>
  <figure class="lb-fig">
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
</div>
<script src="main.js"></script>
</body>
</html>
